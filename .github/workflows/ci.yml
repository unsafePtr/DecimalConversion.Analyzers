name: Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - uses: actions/checkout@v7

    # The 10.0 runtime runs the net10.0 tests. The pin in global.json rolls forward to this newer 11.0 SDK.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.x
          11.0.100-rc.3.26522.148

    - name: Restore dependencies
      run: dotnet restore DecimalConversion.slnx

    - name: Build
      run: dotnet build DecimalConversion.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet test --solution DecimalConversion.slnx --configuration Release --no-build --verbosity normal
